name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the bundle into the real project files
        run: |
          python3 - <<'PY'
          import re, os
          txt = open('planets-bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^=====FILE: (.+?)=====\n', txt, flags=re.M)
          n = 0
          for i in range(1, len(parts), 2):
              path, content = parts[i].strip(), parts[i + 1]
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              open(path, 'w', encoding='utf-8', newline='\n').write(content)
              n += 1
          print('unpacked', n, 'files')
          PY
          find src -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: planets-mod-jar
          path: build/libs/planets-*.jar
